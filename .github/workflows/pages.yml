name: Hugo Pages
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  HUGO_VERSION: 0.166.0
  TZ: Europe/Istanbul
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install pinned Hugo Extended
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          echo "0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/hugo-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/hugo-bin" hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"
      - name: Validate SEO and publication rules
        shell: pwsh
        run: ./scripts/check-site.ps1
      - name: Build production
        run: hugo --environment production --minify --buildDrafts=false --buildFuture=false --destination public
      - name: Reject development output
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn 'https?://localhost|livereload\.js' public --include='*.html' --include='*.xml'; then
            echo 'Development output found.'
            exit 1
          fi
          test -f public/404.html
          test -f public/sitemap.xml
          test -f public/robots.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
